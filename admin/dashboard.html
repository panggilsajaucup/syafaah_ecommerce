<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard Admin – Syafa'ah</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg" />
  <link rel="stylesheet" href="../css/admin.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="admin-layout">
  <!-- Sidebar -->
  <aside class="admin-sidebar" id="admin-sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo" id="sidebar-logo">S</div>
      <div>
        <div class="sidebar-brand-name" id="sidebar-site-name">Syafa'ah</div>
        <div class="sidebar-tagline">Admin Panel</div>
      </div>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-section-label">Menu Utama</div>
      <a class="nav-item active" href="dashboard.html"><span class="nav-icon">📊</span> Dashboard</a>
      <a class="nav-item" href="products.html"><span class="nav-icon">🛍️</span> Produk</a>
      <a class="nav-item" href="settings.html"><span class="nav-icon">⚙️</span> Pengaturan</a>
      <div class="nav-section-label">Lainnya</div>
      <a class="nav-item" href="../index.html" target="_blank"><span class="nav-icon">🌐</span> Lihat Website</a>
    </nav>
    <div class="sidebar-footer">
      <div class="sidebar-user">
        <div class="user-avatar">👤</div>
        <div>
          <div class="user-name" id="admin-username">owner</div>
          <div class="user-role">Administrator</div>
        </div>
      </div>
      <button class="btn-logout" onclick="adminLogout()">🚪 Keluar</button>
    </div>
  </aside>

  <div class="sidebar-mob-overlay" id="sidebar-mob-overlay" onclick="toggleSidebar()"></div>

  <!-- Main -->
  <main class="admin-main">
    <div class="admin-topbar">
      <div style="display:flex;align-items:center;gap:12px;">
        <button class="hamburger btn-sm secondary" onclick="toggleSidebar()">☰</button>
        <div class="topbar-title">Dashboard</div>
      </div>
      <div class="topbar-actions">
        <a href="products.html" class="btn-sm primary">+ Tambah Produk</a>
      </div>
    </div>

    <div class="page-content">
      <!-- Stats -->
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-icon gold">🛍️</div>
          <div><div class="stat-val" id="stat-total">—</div><div class="stat-lbl">Total Produk</div></div>
        </div>
        <div class="stat-card">
          <div class="stat-icon green">⭐</div>
          <div><div class="stat-val" id="stat-bestseller">—</div><div class="stat-lbl">Best Seller</div></div>
        </div>
        <div class="stat-card">
          <div class="stat-icon blue">🎨</div>
          <div><div class="stat-val" id="stat-variants">—</div><div class="stat-lbl">Total Varian</div></div>
        </div>
        <div class="stat-card">
          <div class="stat-icon purple">📦</div>
          <div><div class="stat-val" id="stat-cats">6</div><div class="stat-lbl">Kategori</div></div>
        </div>
      </div>

      <!-- Recent Products -->
      <div class="admin-card">
        <div class="admin-card-header">
          <div class="admin-card-title">Produk Terbaru</div>
          <a href="products.html" class="btn-sm secondary">Lihat Semua</a>
        </div>
        <div class="table-wrap">
          <table class="data-table">
            <thead>
              <tr>
                <th>Produk</th>
                <th>Kategori</th>
                <th>Varian</th>
                <th>Status</th>
                <th>Aksi</th>
              </tr>
            </thead>
            <tbody id="recent-products-body">
              <tr><td colspan="5" style="text-align:center;padding:40px;color:var(--text-light);">Memuat...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>
</div>

<div class="toast" id="admin-toast"></div>

<script src="../js/supabase.js"></script>
<script src="admin.js"></script>
<script>
  checkAdminAuth();
  document.getElementById('admin-username').textContent = sessionStorage.getItem('admin_username') || 'owner';

  async function init() {
    await loadAdminBranding();
    const [prodRes, varRes] = await Promise.all([
      supabase.from('products').select('*').order('created_at', { ascending: false }),
      supabase.from('product_variants').select('*')
    ]);

    const products = prodRes.data || [];
    const variants = varRes.data || [];

    document.getElementById('stat-total').textContent = products.length;
    document.getElementById('stat-bestseller').textContent = products.filter(p => p.is_best_seller).length;
    document.getElementById('stat-variants').textContent = variants.length;

    const tbody = document.getElementById('recent-products-body');
    if (!products.length) {
      tbody.innerHTML = `<tr><td colspan="5"><div class="admin-empty"><span>📦</span><p>Belum ada produk</p></div></td></tr>`;
      return;
    }

    tbody.innerHTML = products.slice(0, 8).map(p => {
      const pvs = variants.filter(v => v.product_id === p.id);
      const firstImg = pvs[0]?.photo_url;
      return `<tr>
        <td>
          <div class="td-img-wrap">
            ${firstImg ? `<img src="${firstImg}" class="td-img" alt="${p.name}" onerror="this.style.display='none'">` : '<div class="td-img" style="display:flex;align-items:center;justify-content:center;font-size:20px;opacity:.4">👘</div>'}
            <div>
              <div class="td-name">${p.name}</div>
              <small>${p.available_sizes?.join(', ') || 'Tanpa ukuran'}</small>
            </div>
          </div>
        </td>
        <td><span class="badge gold">${p.category}</span></td>
        <td>${pvs.length} varian</td>
        <td>${p.is_best_seller ? '<span class="badge green">⭐ Best Seller</span>' : '<span class="badge gray">Regular</span>'}</td>
        <td>
          <div class="actions-cell">
            <a href="products.html?edit=${p.id}" class="icon-btn edit" title="Edit">✏️</a>
          </div>
        </td>
      </tr>`;
    }).join('');
  }

  init();
</script>
</body>
</html>
