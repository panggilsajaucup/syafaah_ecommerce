<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login Admin – Syafa'ah Muslim Wear</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg" />
  <link rel="stylesheet" href="../css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; background: linear-gradient(135deg, #2C1810 0%, #4A2E1A 40%, #3D2B0F 100%); }
    .login-card { background: var(--white); border-radius: var(--radius-xl); padding: 48px 40px; width: 100%; max-width: 420px; box-shadow: var(--shadow-lg); }
    .login-logo { width: 56px; height: 56px; background: linear-gradient(135deg, var(--gold), var(--gold-dark)); border-radius: 16px; display: flex; align-items: center; justify-content: center; font-family: var(--font-display); font-size: 26px; font-weight: 600; color: var(--white); margin: 0 auto 20px; }
    .login-title { font-family: var(--font-display); font-size: 26px; font-weight: 600; text-align: center; color: var(--text-primary); margin-bottom: 6px; }
    .login-subtitle { text-align: center; font-size: 13.5px; color: var(--text-secondary); margin-bottom: 36px; }
    .form-group { margin-bottom: 18px; }
    .form-label { display: block; font-size: 13px; font-weight: 600; color: var(--text-secondary); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
    .form-input { width: 100%; height: 48px; border: 1.5px solid var(--sand); border-radius: var(--radius-sm); padding: 0 16px; font-size: 14.5px; color: var(--text-primary); background: var(--cream); outline: none; transition: border-color var(--transition), box-shadow var(--transition); }
    .form-input:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(184,149,74,0.12); }
    .btn-login { width: 100%; height: 50px; background: linear-gradient(135deg, var(--gold), var(--gold-dark)); color: var(--white); border-radius: 25px; font-size: 15px; font-weight: 700; letter-spacing: 0.3px; transition: transform var(--transition), box-shadow var(--transition); box-shadow: var(--shadow-gold); margin-top: 8px; }
    .btn-login:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(184,149,74,0.4); }
    .btn-login:disabled { opacity: 0.7; cursor: not-allowed; }
    .login-error { background: #FEE2E2; border: 1px solid #FECACA; border-radius: var(--radius-sm); padding: 12px 16px; font-size: 13.5px; color: #DC2626; margin-top: 12px; display: none; }
    .back-link { display: block; text-align: center; margin-top: 24px; font-size: 13px; color: var(--text-light); }
    .back-link a { color: var(--gold-dark); font-weight: 500; }
    .back-link a:hover { text-decoration: underline; }
    .input-icon-wrap { position: relative; }
    .input-icon { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); cursor: pointer; font-size: 16px; color: var(--text-light); }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-logo" id="login-logo">S</div>
    <div class="login-title">Admin Panel</div>
    <div class="login-subtitle" id="login-site-name">Syafa'ah Muslim Wear</div>

    <div class="form-group">
      <label class="form-label">Username</label>
      <input type="text" class="form-input" id="username" placeholder="Masukkan username" autocomplete="username" />
    </div>
    <div class="form-group">
      <label class="form-label">Password</label>
      <div class="input-icon-wrap">
        <input type="password" class="form-input" id="password" placeholder="Masukkan password" autocomplete="current-password" />
        <span class="input-icon" onclick="togglePwd()">👁️</span>
      </div>
    </div>

    <button class="btn-login" id="login-btn" onclick="doLogin()">Masuk</button>
    <div class="login-error" id="login-error">❌ Username atau password salah.</div>

    <div class="back-link">← <a href="../index.html">Kembali ke Website</a></div>
  </div>

  <script src="../js/supabase.js"></script>
  <script>
    // Check if already logged in
    if (sessionStorage.getItem('admin_logged_in') === 'true') {
      window.location.href = 'dashboard.html';
    }

    // Load site name
    loadSiteSettings().then(s => {
      const name = s.site_name || "Syafa'ah Muslim Wear";
      document.getElementById('login-site-name').textContent = name;
      document.getElementById('login-logo').textContent = name.charAt(0);
    });

    document.getElementById('password').addEventListener('keydown', e => {
      if (e.key === 'Enter') doLogin();
    });

    async function doLogin() {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const btn = document.getElementById('login-btn');
      const errEl = document.getElementById('login-error');

      if (!username || !password) {
        errEl.textContent = '⚠️ Harap isi username dan password.';
        errEl.style.display = 'block'; return;
      }

      btn.disabled = true;
      btn.textContent = 'Memuat...';
      errEl.style.display = 'none';

      const { data, error } = await supabase
        .from('admin_users')
        .select('*')
        .eq('username', username)
        .eq('password', password)
        .single();

      if (error || !data) {
        errEl.textContent = '❌ Username atau password salah.';
        errEl.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Masuk';
        return;
      }

      sessionStorage.setItem('admin_logged_in', 'true');
      sessionStorage.setItem('admin_username', username);
      window.location.href = 'dashboard.html';
    }

    function togglePwd() {
      const inp = document.getElementById('password');
      inp.type = inp.type === 'password' ? 'text' : 'password';
    }
  </script>
</body>
</html>
